name: Build

# Builds the operator image for linux/amd64 and linux/arm64.
# - Pull requests: build and smoke-test only, nothing is pushed.
# - Pushes to main: push ghcr.io/<owner>/<repo>:main and :sha-<short sha>.
# - Tags v*.*.*: push :<version> and :<major>.<minor>, and publish the Helm
#   chart with the same version to oci://ghcr.io/<owner>/charts.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  image:
    name: Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Smoke-test the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: harbor-operator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm harbor-operator:ci --help

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: Helm chart
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup just
        uses: extractions/setup-just@v3

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Verify the chart matches the generated manifests
        run: just helm-verify

      - name: Package the chart
        run: |
          # The chart's appVersion is the default image tag, so it must
          # match the image tag pushed by the image job (version without "v").
          version="${GITHUB_REF_NAME#v}"
          sed -i -e "s/^version: .*/version: ${version}/" \
                 -e "s/^appVersion: .*/appVersion: \"${version}\"/" charts/harbor-operator/Chart.yaml
          helm package charts/harbor-operator --destination dist
          echo "CHART=dist/harbor-operator-${version}.tgz" >> "$GITHUB_ENV"

      - name: Push the chart to GHCR
        env:
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | helm registry login "$REGISTRY" --username "${{ github.actor }}" --password-stdin
          helm push "$CHART" "oci://${REGISTRY}/${OWNER,,}/charts"
