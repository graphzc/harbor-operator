# Project-level robot. The secret generated by Harbor is stored in the Secret
# "team-a-ci-credentials" (keys: username, password).
apiVersion: harbor.graphzc.io/v1alpha1
kind: RobotAccount
metadata:
  labels:
    app.kubernetes.io/name: harbor-operator
    app.kubernetes.io/managed-by: kustomize
  name: team-a-ci
spec:
  harborConnectionRef:
    name: harbor
  name: ci
  level: project
  project: team-a
  description: CI pipeline for team-a
  duration: -1
  permissions:
    - access:
        - resource: repository
          action: pull
        - resource: repository
          action: push
        - resource: artifact
          action: read
  generatedSecret:
    name: team-a-ci-credentials
---
# System-level robot that can pull from every project, using a secret you
# provide (8-128 chars with upper case, lower case and a number).
apiVersion: harbor.graphzc.io/v1alpha1
kind: RobotAccount
metadata:
  labels:
    app.kubernetes.io/name: harbor-operator
    app.kubernetes.io/managed-by: kustomize
  name: puller
spec:
  harborConnectionRef:
    name: harbor
  name: puller
  level: system
  permissions:
    - kind: project
      namespace: "*"
      access:
        - resource: repository
          action: pull
  secretRef:
    name: puller-secret
    key: secret
