---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: robotaccounts.harbor.graphzc.io
spec:
  group: harbor.graphzc.io
  names:
    kind: RobotAccount
    listKind: RobotAccountList
    plural: robotaccounts
    shortNames:
    - hra
    singular: robotaccount
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.fullName
      name: Robot
      type: string
    - jsonPath: .spec.level
      name: Level
      type: string
    - jsonPath: .spec.project
      name: Project
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: RobotAccount is a Harbor robot account, either system-wide or
          scoped to a project.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RobotAccountSpec defines the desired state of a Harbor robot
              account.
            properties:
              deletionPolicy:
                default: Delete
                description: DeletionPolicy controls whether the Harbor robot is removed
                  with this resource.
                enum:
                - Delete
                - Orphan
                type: string
              description:
                description: Description of the robot.
                type: string
              disabled:
                description: Disabled disables the robot.
                type: boolean
              duration:
                default: -1
                description: Duration of the robot in days; -1 never expires.
                format: int64
                type: integer
              generatedSecret:
                description: |-
                  GeneratedSecret configures the Secret holding the robot credentials.
                  The Secret holds the keys "username" and "password".
                properties:
                  name:
                    description: Name of the Secret to create. Defaults to "<resource-name>-harbor-credentials".
                    type: string
                type: object
              harborConnectionRef:
                description: HarborConnectionRef selects the Harbor instance.
                properties:
                  name:
                    description: Name of the HarborConnection.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              level:
                default: system
                description: Level of the robot. Immutable.
                enum:
                - system
                - project
                type: string
              name:
                description: Name of the robot, without the Harbor robot prefix. Immutable.
                pattern: ^[a-z0-9]+(?:[._-][a-z0-9]+)*$
                type: string
              permissions:
                description: Permissions granted to the robot.
                items:
                  description: RobotPermission grants access on a namespace (project)
                    or the system.
                  properties:
                    access:
                      description: Access rules granted.
                      items:
                        description: RobotAccess is a single resource/action pair,
                          e.g. repository/pull.
                        properties:
                          action:
                            description: Action, e.g. pull, push, read, list, create,
                              delete.
                            minLength: 1
                            type: string
                          effect:
                            description: Effect of the access rule.
                            enum:
                            - allow
                            - deny
                            type: string
                          resource:
                            description: Resource, e.g. repository, artifact, tag,
                              helm-chart, scan.
                            minLength: 1
                            type: string
                        required:
                        - action
                        - resource
                        type: object
                      minItems: 1
                      type: array
                    kind:
                      default: project
                      description: Kind of the permission target.
                      enum:
                      - project
                      - system
                      type: string
                    namespace:
                      description: |-
                        Namespace is the project name, "*" for all projects, or "/" for system
                        permissions. For project-level robots it defaults to spec.project.
                      type: string
                  required:
                  - access
                  type: object
                minItems: 1
                type: array
              project:
                description: Project the robot belongs to (project-level robots only).
                type: string
              secretRef:
                description: |-
                  SecretRef selects an existing Secret key holding the robot secret.
                  When omitted, the secret generated by Harbor is stored in GeneratedSecret.
                  Harbor requires 8-128 characters with upper case, lower case and a number.
                properties:
                  key:
                    default: password
                    description: Key within the Secret. Defaults to "password".
                    type: string
                  name:
                    description: Name of the Secret.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - harborConnectionRef
            - name
            - permissions
            type: object
            x-kubernetes-validations:
            - message: name is immutable
              rule: self.name == oldSelf.name
            - message: level is immutable
              rule: self.level == oldSelf.level
            - message: project is required for project-level robots
              rule: self.level != 'project' || (has(self.project) && size(self.project)
                > 0)
          status:
            description: RobotAccountStatus defines the observed state of RobotAccount.
            properties:
              conditions:
                description: Conditions represent the latest observations of the resource
                  state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              expiresAt:
                description: ExpiresAt is when the robot expires; unset when it never
                  expires.
                format: date-time
                type: string
              fullName:
                description: FullName is the robot name as used to log in, e.g. robot$name.
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation reconciled.
                format: int64
                type: integer
              robotID:
                description: RobotID is the Harbor robot ID.
                format: int64
                type: integer
              secretHash:
                description: SecretHash is a hash of the last secret applied to Harbor.
                type: string
              secretName:
                description: SecretName is the Secret holding the robot credentials.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
